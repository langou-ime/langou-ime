server {
    listen 80;
    listen [::]:80;
    server_name api.langou.tech;

    access_log /var/log/nginx/langou-api-access.log combined;
    error_log /var/log/nginx/langou-api-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 503 "TLS bootstrap in progress\n";
        add_header Content-Type text/plain always;
    }
}
