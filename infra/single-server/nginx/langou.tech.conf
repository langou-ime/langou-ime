# The website document root and every non-download asset remain unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name langou.tech www.langou.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name langou.tech www.langou.tech;

    ssl_certificate /etc/letsencrypt/live/langou.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/langou.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    root /opt/langou/website-v3;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location /zh/ {
        try_files $uri $uri/ /zh/index.html =404;
    }

    location /en/ {
        try_files $uri $uri/ /en/index.html =404;
    }

    location /downloads/ {
        alias /opt/langou/downloads/;
        autoindex off;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~* \.(css|js|png|jpg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
