name: Langou monorepo CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: langou-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
  BUILD_ABI: armeabi-v7a,arm64-v8a,x86,x86_64
  BOOST_VERSION: "1.84.0"
  BOOST_ROOT: "${{ github.workspace }}\\deps\\boost_1_84_0"
  INTERNAL_RELEASE_PUBLIC_KEY_BASE64: "NL+5JaOJjU8FhrLZueXoqi7XNagy6K0xe9etWtUvPQY="

jobs:
  backend:
    name: Backend tests, lint, and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: production/backend
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            production/backend/requirements.lock
            production/backend/requirements-dev.lock

      - name: Install exact dependencies
        run: |
          python -m pip install --require-hashes --requirement requirements.lock
          python -m pip install --requirement requirements-dev.lock
          python -m pip install --no-deps .

      - name: Audit production dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --requirement requirements.lock --disable-pip

      - name: Test backend
        run: pytest -q tests

      - name: Lint backend
        run: ruff check src tests scripts

  website:
    name: Website tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: production/website
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24.17.0"
          cache: npm
          package-manager-cache: false
          cache-dependency-path: production/website/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Test release and privacy surfaces
        run: npm test

      - name: Build production website
        run: npm run build

  android:
    name: Android unit tests and internal APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            production/android/**/*.gradle.kts
            production/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install native build tools
        run: sdkmanager --install "cmake;3.31.6" "build-tools;$ANDROID_BUILD_TOOLS_VERSION"

      - name: Test Android build logic
        working-directory: production/android
        run: ./gradlew -p build-logic :convention:test

      - name: Test Android and build debug APKs
        working-directory: production/android
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Verify universal debug APK signature
        run: |
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/apksigner" verify --verbose \
            production/android/app/build/outputs/apk/debug/*-universal-debug.apk

      - name: Upload internal Android evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: INTERNAL-android-${{ github.sha }}
          path: production/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  android-instrumentation:
    name: Android IME smoke · API ${{ matrix.api-level }}
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 29, 30, 34, 36]
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            production/android/**/*.gradle.kts
            production/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run real input method instrumentation
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009 # v2.37.0
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          script: cd production/android && ./gradlew connectedDebugAndroidTest --stacktrace

  windows-managed:
    name: Windows assistant tests and build
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: production/windows
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "8.0.x"
          cache: true
          cache-dependency-path: |
            production/windows/LangouAssistant.Core/packages.lock.json
            production/windows/LangouAssistant.Tests/packages.lock.json
            production/windows/LangouAssistant/packages.lock.json

      - name: Restore fixed dependencies
        run: |
          dotnet restore .\LangouAssistant.Tests\LangouAssistant.Tests.csproj --locked-mode --nologo
          dotnet restore .\LangouAssistant\LangouAssistant.csproj --locked-mode --nologo

      - name: Test Windows assistant and EXE contracts
        run: dotnet test .\LangouAssistant.Tests\LangouAssistant.Tests.csproj --configuration Debug --no-restore --nologo

      - name: Build Windows assistant
        run: dotnet build .\LangouAssistant\LangouAssistant.csproj --configuration Debug --no-restore --nologo

  windows-package:
    name: Windows native TSF and internal EXE
    needs: windows-managed
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        working-directory: production/windows
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize Windows native submodules
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: git submodule update --init --recursive -- production/windows/librime production/windows/plum

      - name: Set up .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "8.0.x"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Configure Visual Studio 2022 native build
        shell: pwsh
        run: |
          Copy-Item .\env.vs2022.bat .\env.bat
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsDevCmd = & $vswhere -latest -products "*" `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find "Common7\Tools\VsDevCmd.bat"
          if (-not $vsDevCmd) { throw "Visual C++ x64 toolchain was not found." }
          "VSDEVCMD=$vsDevCmd" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache fixed Boost source and libraries
        id: boost-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: "${{ env.BOOST_ROOT }}"
          key: "windows-2022-boost-${{ env.BOOST_VERSION }}-win10-v1"

      - name: Install and build Boost
        if: steps.boost-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call install_boost.bat
          if errorlevel 1 exit /b 1

      - name: Fetch pinned librime binaries
        shell: pwsh
        run: .\get-rime.ps1 -tag 1.13.1 -use dev

      - name: Install NSIS
        shell: cmd
        run: |
          call install_nsis.bat
          if errorlevel 1 exit /b 1

      - name: Compile native bridge parser test
        shell: cmd
        run: |
          call "%VSDEVCMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /utf-8 /I"%BOOST_ROOT%" /I"WeaselServer" test\LangouBridgeProtocolTest.cpp WeaselServer\LangouBridgeProtocol.cpp /Fe:LangouBridgeProtocolTest.exe
          if errorlevel 1 exit /b 1
          LangouBridgeProtocolTest.exe
          if errorlevel 1 exit /b 1

      - name: Build Weasel TSF and RIME binaries
        shell: cmd
        env:
          RELEASE_BUILD: "1"
        run: |
          xcopy /E /I /Y rime-data output\data
          call build.bat release
          if errorlevel 1 exit /b 1

      - name: Build one-click internal EXE
        shell: pwsh
        run: .\scripts\Build-LangouPackage.ps1 -ReleasePublicKeyBase64 "${{ env.INTERNAL_RELEASE_PUBLIC_KEY_BASE64 }}"

      - name: Upload internal Windows evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: INTERNAL-windows-${{ github.sha }}
          path: |
            production/windows/artifacts/langou/installer/**/langou-ime-windows-x64-v1.0.0.exe
            production/windows/artifacts/langou/langou-ime-windows-x64-v1.0.0.exe.sha256
          if-no-files-found: error
          retention-days: 7
