# https://developer.android.com/build/optimize-your-build#disable-the-jetifier-flag
android.enableJetifier=false
android.useAndroidX=true

# enlarge heap size to 4GB
org.gradle.jvmargs=-Xmx4096M -XX:+HeapDumpOnOutOfMemoryError

# KSP2 is required by the current KSP toolchain.
ksp.useKSP2=true
# Avoid incremental symbol lookup cache corruption in release builds.
ksp.incremental=false
buildVersionName=1.0.0
buildGitRepo=https://github.com/langou-ime/android
