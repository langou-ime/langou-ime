limit_req_zone $binary_remote_addr zone=langou_api_per_ip:10m rate=60r/m;

upstream langou_v1_api {
    server 127.0.0.1:18000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.langou.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.langou.tech;

    ssl_certificate /etc/letsencrypt/live/api.langou.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.langou.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LANGOU_API_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/langou-api-access.log combined;
    error_log /var/log/nginx/langou-api-error.log warn;

    client_max_body_size 256k;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        limit_req zone=langou_api_per_ip burst=30 nodelay;

        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no always;
    }
}
