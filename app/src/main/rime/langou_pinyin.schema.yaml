__include: luna_pinyin_simp.schema:/

schema:
  schema_id: langou_pinyin
  name: 懒狗拼音
  version: "1.0.0"
  author:
    - Langou Input Method contributors
  description: 懒狗输入法全拼方案

# Keep the complete input pipeline in the branded schema.  Rime applies the
# inherited luna_pinyin custom patch while resolving __include; declaring the
# pipeline here prevents that patch from leaving a filter-only engine.
engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator@custom_phrase
    - reverse_lookup_translator
    - script_translator
  filters:
    - simplifier
    - simplifier@emoji_suggestion
    - uniquifier
