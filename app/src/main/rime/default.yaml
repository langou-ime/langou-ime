# Modified for Langou Input Method.

config_version: "1.0.0"

schema_list:
  - schema: luna_pinyin_simp
  - schema: langou_t9

switcher:
  caption: 输入方案
  hotkeys:
    - Control+grave
    - F4
  save_options:
    - full_shape
    - ascii_punct
    - zh_hans
    - emoji_suggestion
  fold_options: true
  abbreviate_options: true
  option_list_separator: " · "

menu:
  page_size: 9

punctuator:
  full_shape:
    __include: punctuation:/full_shape
  half_shape:
    __include: punctuation:/half_shape

key_binder:
  bindings:
    __patch:
      - key_bindings:/paging_with_minus_equal
      - key_bindings:/paging_with_comma_period

recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:).*$|^[a-z]+[.].+$"

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: inline_ascii
    Shift_R: commit_text
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
